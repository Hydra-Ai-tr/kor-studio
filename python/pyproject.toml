[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "korstudio"
version = "0.4.0"
description = "Write training skills and tools for Kor Studio in Python"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["kor-studio", "machine-learning", "training", "plugins"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Hydra-Ai-tr/kor-studio"
Documentation = "https://github.com/Hydra-Ai-tr/kor-studio/blob/main/docs/plugins.md"

[project.scripts]
kor = "kor.hub:main"

[tool.setuptools]
packages = ["kor"]
